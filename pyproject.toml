[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicommit"
version = "1.9.0"
description = "AI-powered git commit message generator — stop writing boring commits"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ghy", email = "Ghy52120@163.com"}
]
keywords = ["git", "commit", "ai", "cli", "conventional-commits", "openai", "deepseek"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]

[project.scripts]
aicommit = "aicommit.cli:main"

[project.urls]
Homepage = "https://github.com/Ghy/aicommit"
Repository = "https://github.com/Ghy/aicommit"
Issues = "https://github.com/Ghy/aicommit/issues"

[tool.setuptools.packages.find]
include = ["aicommit*"]

[tool.ruff]
line-length = 100
